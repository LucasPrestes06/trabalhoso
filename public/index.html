<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard SO</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<h1>Dashboard de Sistema Operacional</h1>

<div class="container">

    <div class="card">
        <h3>Hostname</h3>
        <p id="hostname"></p>
    </div>

    <div class="card">
        <h3>Sistema</h3>
        <p id="platform"></p>
    </div>

    <div class="card">
        <h3>Arquitetura</h3>
        <p id="arch"></p>
    </div>

    <div class="card">
        <h3>CPUs</h3>
        <p id="cpus"></p>
    </div>

    <div class="card">
        <h3>Memória Total</h3>
        <p id="memTotal"></p>
    </div>

    <div class="card">
        <h3>Memória Livre</h3>
        <p id="memFree"></p>
    </div>

    <div class="card">
        <h3>Uso de RAM</h3>
        <p id="memUsage"></p>
    </div>

    <div class="card">
        <h3>IP</h3>
        <p id="ip"></p>
    </div>

    <div class="card">
        <h3>Node.js</h3>
        <p id="node"></p>
    </div>

    <div class="card">
        <h3>Ambiente</h3>
        <p id="environment"></p>
    </div>

    <div class="card">
        <h3>Kernel</h3>
        <p id="release"></p>
    </div>

    <div class="card">
        <h3>Uptime</h3>
        <p id="uptime"></p>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
